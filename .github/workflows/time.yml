name: Update README timestamp

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update_dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "vshengbro"
          git config user.email "root@ltpp.vip"

      - name: Update README.md with current UTC time
        run: |
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S")
          if [ ! -f README.md ]; then
            echo "<!--${CURRENT_TIME}-->" > README.md
          else
            sed -i "1s/.*/<!--${CURRENT_TIME}-->/" README.md
          fi
          echo "Updated README.md with time: ${CURRENT_TIME}"

      - name: Commit and push
        run: |
          set -e
          if git diff --quiet -- README.md; then
            echo "README.md already up to date, nothing to commit"
            exit 0
          fi
          git add README.md
          git commit -m "chore: update README timestamp to $(date -u +'%Y-%m-%d %H:%M:%S')"
          BRANCH=$(git branch --show-current)
          git push origin HEAD:$BRANCH
          echo "Pushed timestamp update to $BRANCH"
